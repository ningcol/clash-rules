# Clash 规则集构建配置 —— 唯一配置源。
# 脚本读它构建、README 订阅表格由它生成。改配置只改这里。
defaults:
  timeout-seconds: 30
  retries: 3
  max-shrink-percent: 30      # 任一产物较上一版跌幅超此值 → 构建失败、不发布
  publish-branch: release     # 产物发布到该分支；订阅 URL 指向它
  # 上游被判为非法而丢弃的行数上限（绝对条数，不是比例）→ 超了构建失败、不发布。
  # 默认 0：路由类目里丢一条就可能丢掉一整个顶级域。`+.cn` 那次是 111516 行里的
  # 1 行，任何比例阈值都会放行，而它是整个 .cn 直连规则，中国站点全部漏去代理。
  # 要调高先看构建报告里的样本，确认那些行确实是垃圾。
  max-invalid: 0
  # 产物从上一版消失时构建失败。创建产物不设闸、销毁产物致命，这个不对称会
  # 自我循环：某个上游某天多写一行 IP 规则会生成 final_<类目>_ipcidr.yaml，
  # 撤掉的第二天起每一趟都以同样方式失败（release 分支上文件还在）。
  # 确认删除是有意的，临时置 true 发一次，然后改回来。
  allow-product-removal: false
  # 单个上游源较上一版的解析条数跌幅上限 → 超了构建失败、不发布。
  # 上面那道 max-shrink-percent 量的是**整个类目**，于是多源类目里死掉一个源
  # 会被其他源盖住。实测把每个源逐个清空跑完整管线：10 个源里 7 个整份变空
  # 跌幅都不到 8%，其中 apple 那个是它**唯一**的源、清空后产物条数一条不差
  # （产物全靠 manual/apple.txt 撑着），类目级的闸结构上就看不见。
  # 另有两条不受此百分比约束、写死在代码里：上一版有量、这一版为 0 一律致命；
  # 上一版不足 20 条的源不按百分比判（ACL4SSR Bing 只有 3 条，差一行就是 33%）。
  max-source-shrink-percent: 30
  # 裸顶级域后缀规则（+.cn / +.icbc / +.xn--fiqs8s）从上一版消失时构建失败。
  # 上面三道闸看的都是**条数**，而 +.cn 是 110757 条里的 1 条 —— 上游哪天删了它，
  # 跌幅 0.0009%，三道闸全绿，整个 .cn 落到兜底组走代理。8-11 那次是本地解析
  # 丢的，这道闸防的是同一件事从上游发生。
  # 实测 direct 有 50 条、proxy 有 71 条、其余类目 0 条，近 12 次发布零抖动。
  # 确认某个顶级域该消失，临时置 true 发一次，然后改回来。
  allow-tld-removal: false

# 路由类目的线性优先级：前者从后者中排除，保证每个域名只落在一个路由类目里。
# 手工指派（manual/<cat>.txt）优先于此顺序。reject 不在此列（策略叠加层）。
priority: [microsoft, apple, icloud, proxy, direct]

categories:
  reject:
    description: 广告拦截规则
    # 唯一放宽 max-invalid 的类目。理由**不是**「拦截规则丢了没关系」——闸的
    # 错误是全局收集的，任何一条都会拒绝整次发布，reject 超限一样冻住 direct
    # 和 proxy。理由是广告源本身行内垃圾多、随上游天天变，而路由类目的源不会，
    # 这个余量是为了别让那种噪音把发布打死。当前实测恒定丢 2 行（拉了三个月
    # 11 个历史版本核对，永远是同样那两行），留 10 倍余量。
    max-invalid: 20
    sources:
      - url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/reject.txt
        note: Loyalsoldier/clash-rules
      - url: https://raw.githubusercontent.com/qq5460168/AD886/refs/heads/main/clash_meta.yaml
        note: qq5460168/AD886
      - url: https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/refs/heads/main/Filters/AWAvenue-Ads-Rule-Clash.yaml
        note: AWAvenue-Ads-Rule

  microsoft:
    description: 微软服务规则
    sources:
      - url: https://ruleset.skk.moe/Clash/non_ip/microsoft.txt
        note: SukkaW/Surge
      - url: https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/refs/heads/master/Clash/Microsoft.list
        note: ACL4SSR Microsoft
      - url: https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/refs/heads/master/Clash/Bing.list
        note: ACL4SSR Bing

  apple:

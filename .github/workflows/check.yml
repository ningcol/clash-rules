name: Check rules

# PR / push 验证：lint 手工文件、跑单测、干跑一次完整构建（验证所有源可拉取、
# 可解析、可构建）。不发布。发布由 publish.yml 负责。
on:
  pull_request:
  push:
    branches: [main]
    # 只在影响构建的输入变动时触发，避免旧管线每日往 main 提交 final_*.yaml 时空跑。
    paths:
      - 'config.yaml'
      - 'scripts/**'
      - 'manual/**'
      - 'tests/**'
      - 'README.md'
      - '.github/workflows/check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Lint manual files
        run: python scripts/build.py lint

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: README subscription table in sync
        run: python scripts/build.py readme --check

      # 取上一版 release 做基线。没有它，--previous 缺席 -> 收缩闸与「产物消失」
      # 闸在 PR 上完全不生效，一个把某类目砍掉一半的改动会全绿通过。
      - name: Fetch current release as gate baseline
        id: baseline
        continue-on-error: true
        run: |
          git fetch --depth=1 origin release
          rm -rf prev && mkdir prev
          git archive origin/release | tar -x -C prev
          ls prev/final_*.yaml >/dev/null 2>&1

      - name: Validation build (fetches all sources + full pipeline, no publish)
        run: |
          if [ "${{ steps.baseline.outcome }}" = "success" ]; then
            python scripts/build.py build --out dist --previous prev
          else
            echo "::warning::no release baseline; shrink/removal gates skipped"
            python scripts/build.py build --out dist
          fi

      - name: Upload built rules
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: ignore
